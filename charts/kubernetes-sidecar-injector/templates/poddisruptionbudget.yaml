{{- if .Values.pdb.create }}
{{- $minAvailable := .Values.pdb.minAvailable }}
{{- $maxUnavailable := .Values.pdb.maxUnavailable }}
{{- $hasMin := and (not (kindIs "invalid" $minAvailable)) (ne (toString $minAvailable) "") }}
{{- $hasMax := and (not (kindIs "invalid" $maxUnavailable)) (ne (toString $maxUnavailable) "") }}
{{- /* The API rejects a PDB with both fields set: maxUnavailable wins when set. */}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | indent 4 }}
spec:
  {{- if $hasMax }}
  maxUnavailable: {{ $maxUnavailable }}
  {{- else if $hasMin }}
  minAvailable: {{ $minAvailable }}
  {{- end }}
  {{- with .Values.pdb.unhealthyPodEvictionPolicy }}
  unhealthyPodEvictionPolicy: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "common.labels" . | indent 6 }}
{{- end }}
