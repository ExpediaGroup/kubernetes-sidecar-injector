name: Build and Release Container and Helm Chart

on:
  push:
    branches:
      - main

# All pushes (version bumps, Chart.yaml commit, gh-pages index, releases) use
# secrets.GH_PERSONAL_ACCESS_TOKEN, so the job's GITHUB_TOKEN only needs read access.
permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - id: github-repository
        uses: ASzc/change-string-case-action@ecd1412d078f2e06e9eedcbaa6fcd988151c3f82 # v8
        with:
          string: ${{ github.repository }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # No build cache on the release path: avoids restoring a cache that
          # could be poisoned from another ref into the publishing job.
          cache: false

      - name: Unit Test
        run: make test

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Code specific changes
        id: code-specific-changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_ignore: |
            charts
            .github
            .run

      - name: Automated Code Version Bump
        if: steps.code-specific-changes.outputs.any_modified == 'true'
        id: code-version-bump
        uses: phips28/gh-action-bump-version@fdad52b3b3bbe8fad96b8ca18c56127a96f603db # v11.0.7
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
        with:
          commit-message: 'CI: Bump app version to {{version}} [skip ci]'

      - name: Set up Docker Buildx
        if: steps.code-specific-changes.outputs.any_modified == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        if: steps.code-specific-changes.outputs.any_modified == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push merge to main
        if: steps.code-specific-changes.outputs.any_modified == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: ${{ steps.github-repository.outputs.lowercase }}:${{ steps.code-version-bump.outputs.newTag }},${{ steps.github-repository.outputs.lowercase }}:latest
          platforms: linux/amd64,linux/arm64

      - name: Get specific changed files
        id: helm-specific-changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            charts/kubernetes-sidecar-injector/**

      - name: Automated Helm Version Bump
        if: steps.helm-specific-changes.outputs.any_modified == 'true'
        id: helm-version-bump
        uses: phips28/gh-action-bump-version@fdad52b3b3bbe8fad96b8ca18c56127a96f603db # v11.0.7
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          PACKAGEJSON_DIR: charts
        with:
          skip-tag: 'true'
          commit-message: 'CI: Bump Helm chart version to {{version}} [skip ci]'

      - name: Extract version from package.json
        uses: sergeysova/jq-action@a3f0d4ff59cc1dddf023fc0b325dd75b10deec58 # v2
        id: version
        with:
          cmd: 'jq .version package.json -r'

      - name: update Chart.yaml
        if: steps.helm-specific-changes.outputs.any_modified == 'true'
        working-directory: charts/kubernetes-sidecar-injector
        run: |
          cat <<EOF > Chart.yaml
          name: ${GITHUB_REPOSITORY#*/}
          home: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}
          version: ${{ steps.helm-version-bump.outputs.newTag }}
          apiVersion: v2
          appVersion: "${{ steps.version.outputs.value }}"
          keywords:
            - kubernetes
            - sidecar-injection
          sources:
            - ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}
          EOF

      - name: commit the new Chart.yml
        if: steps.helm-specific-changes.outputs.any_modified == 'true'
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: Automated Change [skip ci]

      - name: Install Helm
        if: steps.helm-specific-changes.outputs.any_modified == 'true'
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2

      - name: Run chart-releaser
        if: steps.helm-specific-changes.outputs.any_modified == 'true'
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        env:
          CR_TOKEN: "${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}"